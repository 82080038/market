[project]
name = "market"
version = "0.1.0"
description = "Single-user capital market decision-support application (Indonesia + global)"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26,<2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "yfinance>=0.2.40",
    "requests>=2.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "schedule>=1.2",
    "pytz>=2024.1",
    "exchange-calendars>=4.5",
    "python-telegram-bot>=21.3",
    "jinja2>=3.1",
    "aiofiles>=24.1",
    "openpyxl>=3.1.5",
    "reportlab>=5.0.0",
    "pyarrow>=15.0",
    "psycopg2-binary>=2.9",
    "statsmodels>=0.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pytz>=2024.1",
    "types-requests>=2.32",
]
gpu = [
    "torch>=2.5",
    "transformers>=4.44",
]

[project.scripts]
market = "market.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH", "TID", "RUF"
]
ignore = ["TC003", "N803", "N806", "TC002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["pandas", "yfinance"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=market --cov-report=term-missing --cov-fail-under=70"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using.*httpx.*deprecated:UserWarning",
]

[tool.coverage.run]
source = ["src/market"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
