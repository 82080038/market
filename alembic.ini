# Alembic configuration for Market application.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# sqlalchemy.url di-override oleh alembic/env.py yang membaca DATABASE_URL dari .env
# Default di sini hanya fallback jika env.py tidak resolve (mis. CLI tanpa .env)
sqlalchemy.url = postgresql://petrick:market_dev@localhost:5433/market

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
